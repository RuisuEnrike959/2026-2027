<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / ログイン</title>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4 font-sans">

    <form action="welcome.html" method="post" onsubmit="handleLogin(event)" class="space-y-6 w-full max-w-sm">
        <!-- Main container / メインコンテナ -->
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm border border-gray-100">
            
            <!-- Header / ヘッダー -->
            <div class="text-center mb-8">
                <div class="flex justify-center mb-6">
                    <img src="like.jpg" alt="Like" class="w-24 h-auto mx-auto">
                </div>
                <h1 class="text-3xl font-bold text-gray-800 mb-2">Welcome / ようこそ</h1>
                <p class="text-sm text-gray-500">Sign in to your account / ログインしてください</p>
            </div>
            
            <!-- Email Field / メールアドレス -->
            <div>
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Email / メールアドレス</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="your.email@example.com"
                    required 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-gray-50 focus:bg-white"
                >
            </div>

            <!-- Password Field / パスワード -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label for="password" class="block text-sm font-semibold text-gray-700">Password / パスワード</label>
                    <a href="#" class="text-xs text-blue-600 hover:text-blue-800 hover:underline">Forgot password? / お忘れですか？</a>
                </div>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="••••••••"
                    required 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-gray-50 focus:bg-white"
                >
            </div>

            <!-- Remember me / ログイン状態を保持 -->
            <div class="flex items-center">
                <input 
                    type="checkbox" 
                    id="lembrar" 
                    name="lembrar" 
                    class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500 cursor-pointer"
                >
                <label for="lembrar" class="ml-2 text-sm text-gray-600 cursor-pointer">
                    Remember me / ログイン状態を保持
                </label>
            </div>

            <!-- Submit Button / 送信ボタン -->
            <div>
                <button 
                    type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-transform transform hover:-translate-y-0.5 focus:outline-none focus:ring-4 focus:ring-blue-300"
                >
                    Sign In / ログイン
                </button>
            </div>
            
        </div>

        <!-- Registration link / 新規登録リンク -->
        <p class="mt-8 text-center text-sm text-gray-600">
            Don't have an account? / アカウントをお持ちでないですか？<br>
            <a href="#" class="font-semibold text-blue-600 hover:text-blue-800 hover:underline mt-1 inline-block">Register here / 新規登録</a>
        </p>
    </form>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert('Please enter your email and password. / メールアドレスとパスワードを入力してください。');
                return;
            }

            sessionStorage.setItem('loginEmail', email);
            window.location.href = 'welcome.html';
        }
    </script>
</body>
</html>
