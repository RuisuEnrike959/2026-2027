<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome / ようこそ</title>
</head>
<body style="font-family: sans-serif; padding: 2rem; background: #f3f4f6; color: #111827;">
    <div style="max-width: 540px; margin: 0 auto; background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);">
        <h1 style="font-size: 2rem; margin-bottom: 0.75rem;">Welcome / ようこそ</h1>
        <p id="welcome-message" style="font-size: 1rem; color: #374151; margin-bottom: 1.5rem;">Loading...</p>
        <a href="index.html" style="display: inline-block; padding: 0.75rem 1.25rem; background: #2563eb; color: white; border-radius: 0.75rem; text-decoration: none;">Back to Login / ログイン画面へ戻る</a>
    </div>

    <script>
        const message = document.getElementById('welcome-message');
        const email = sessionStorage.getItem('loginEmail');

        if (email) {
            message.textContent = `Hello, ${email}! / ${email}さん、ようこそ！`;
        } else {
            message.textContent = 'Hello, World! / こんにちは！';
        }
    </script>
</body>
</html>
