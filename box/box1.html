<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <style>

        body {

            margin: 0;

            padding: 40px;

            background-color: #821313;

        }



        .mainbox {

            display: grid;

            grid-template-columns: 1fr 1fr 1fr; /* 3 colunas iguais */

            gap: 20px;

            width: fit-content;

        }



        .box {

            width: 200px;

            height: 200px;

            background-color: rgb(173, 230, 191);

            border: 10px solid rgb(26, 156, 93);

            padding: 20px;

            box-sizing: border-box;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

        }



        .box p {

            margin: 0;

            font-size: 14px;

        }

    </style>

</head>

<body>



<div class="mainbox">

    <div class="box"><p>これはボックスです<br>(1)</p></div>

    <div class="box"><p>これは2番目のボックスです<br>(2)</p></div>

    <div class="box"><p>これは3番目のボックスです<br>(3)</p></div>

    <div class="box"><p>これは4番目のボックスです<br>(4)</p></div>

    <div class="box"><p>これは5番目のボックスです<br>(5)</p></div>

    <div class="box"><p>これは6番目のボックスです<br>(6)</p></div>

    <div class="box"><p>これは7番目のボックスです<br>(7)</p></div>

    <div class="box"><p>これは8番目のボックスです<br>(8)</p></div>

    <div class="box"><p>これは9番目のボックスです<br>(9)</p></div>

</div>



</body>

</html>
