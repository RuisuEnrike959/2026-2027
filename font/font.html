<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Example</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap">
    <style>
        .serif-example {
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
        .courier-new {
            font-family: 'Courier New', Courier, monospace;
        }
        .copperplate {
            font-family: 'Copperplate', 'Copperplate Gothic', serif;
        }
    </style>
</head>
<body>
    <p class="serif-example">This is a paragraph with a serif font.</p>
    <p class="courier-new">This is a paragraph with a Courier New font.</p>
    <p class="copperplate">This is a paragraph with a Copperplate font.</p>
    <p><strong>Bold</strong> and <em>italic</em> text.</p>
</body>
</html>
