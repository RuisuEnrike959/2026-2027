<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font1 Example</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap">
    <style>
        .style-normal {
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
        .style-italic {
            font-family: 'Courier New', Courier, monospace;
        }
        .weight-light {
            font-family: 'Copperplate', 'Copperplate Gothic', serif;
        }
        p {
            font-family: 'Oswald', sans-serif;
        }
    </style>
</head>
<body>
    <p class="style-normal">This is a paragraph with a serif font.</p>
    <p class="style-italic">This is a paragraph with a monospace font.</p>
    <p class="weight-light">This is a paragraph with a Copperplate-style font.</p>
</body>
</html>
