<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Age to Drive</title>
</head>
<body>
    <h1 id="result"></h1>
    
    <script>
        let age = 20;
        let hasLicense = true;
        let message = "";
        
        if (age >= 18) {
            if (hasLicense) {
                message = "Can drive ✓";
            } else {
                message = "Cannot drive: no license ✗";
            }
        } else {
            message = "Cannot drive: too young ✗";
        }
        
        console.log(message);
        document.getElementById("result").innerHTML = message;
    </script>
</body>
</html>
