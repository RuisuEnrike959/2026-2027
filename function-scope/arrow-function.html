<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arrow-function></title>
</head>
<body>
    <script>
        const greet1 = Function() {
        console.log("Hello, World!")
       };
       greet1();

        const greet = () => {
        console.log("Hello, World!")
       };
       greet();

       const add =(a, b) => {
        console.log(a, b);
       };
       add(5, 10);
       
    </script>
</body>
</html>
