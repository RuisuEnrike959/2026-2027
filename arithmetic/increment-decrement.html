<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator</title>
</head>
<body>
    10-1-9-1=8-1=7-1=6-1=5-1=4-1=3-1=2-1=1-1=0 decrement
    <br><br>
    1+1=2+1=3+1=4+1=5+1=6+1=7+1=8+1=9+1=10 increment
    <script>

        let a = 10;
        // a-- // decrement: a = a - 1

        console.log("decrement: " + (a--)); // 10
        console.log("decrement: " + (a--)); // 9
        console.log("decrement: " + (a--)); // 8
        console.log("decrement: " + (a--)); // 7
        console.log("decrement: " + (a--)); // 6
        console.log("decrement: " + (a--)); // 5
        console.log("decrement: " + (a--)); // 4
        console.log("decrement: " + (a--)); // 3
        console.log("decrement: " + (a--)); // 2
        console.log("decrement: " + (a--)); // 1
        console.log("decrement: " + (a--)); // 0

        let b = 1;

        b++; // increment: b = b + 1

        console.log("increment: " + (b++)); // 1
        console.log("increment: " + (b++)); // 2
        console.log("increment: " + (b++)); // 3
        console.log("increment: " + (b++)); // 4
        console.log("increment: " + (b++)); // 5
        console.log("increment: " + (b++)); // 6
        console.log("increment: " + (b++)); // 7
        console.log("increment: " + (b++)); // 8
        console.log("increment: " + (b++)); // 9
        console.log("increment: " + (b++)); // 10
    
    </script>
</body>
</html>
