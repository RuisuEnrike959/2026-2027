<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Statement</title>
</head>
<body>
    <script>
        let country = "Japan";
        switch (country) {
            case "United States":
                console.log("It's New York time");
                break;
            case "France":
                console.log("It's Paris time");
                break;
            case "United Kingdom":
                console.log("It's London time");
                break;
            case "Brazil":
                console.log("It's Rio de Janeiro time");
                break;
            default:
                console.log("It's some other country time");
        }
    </script>
</body>
</html>
