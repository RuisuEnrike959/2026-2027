<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color</title>
    <style>

        body {
  background-image: url("forum.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}
        .content {
            background-color: bisque;
            padding: 20px;
            border-radius: 10px;
            margin-top: 50px auto;
        }
    </style>

    </head>
<body>
    <center>
    <div class="content">
        <h1>Background Image Example</h1>
        <p>This page demonstrates how to use a background image in CSS. The image is set to cover the entire background.</p>
    </div>
    </center>
</html>
