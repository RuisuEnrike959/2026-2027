<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        p{
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div>
         <div>
        <p style="text-align: center; font-size: 30px;" id="counter">0</p>
    </div>
    <div style="display: flex; gap: 10px;">
        <div><button id="incrementCounter">Increment</button></div>
        <div><button id="decrementCounter">Decrement</button></div>
        <div><button id="resetCounter">Reset</button></div>
    </div>
</div>

<script>
    let counter = 0;
    const counterDisplay = document.getElementById("counter");
    const incrementButton = document.getElementById("incrementCounter");
    const decrementButton = document.getElementById("decrementCounter");
    const resetButton = document.getElementById("resetCounter");

    incrementButton.addEventListener("click", () => {
        counter++;
        counterDisplay.textContent = counter;
    });

    decrementButton.addEventListener("click", () => {
        counter--;
        counterDisplay.textContent = counter;
    });

    resetButton.addEventListener("click", () => {
        counter = 0;
        counterDisplay.textContent = counter;
    });

</script>
</body>
</html>
