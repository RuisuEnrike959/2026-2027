<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Css Grid Example</title>
        <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: Arial, sans-serif;
                background-color: #f0f0f0;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }
            .card {
                max-width: 850px;
                width: 100%;
                background: white;
                border-radius: 2rem;
                padding: 2rem 1.8rem;
                box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.15);
                transition: all 0.2;
            }
            .grid-demo {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                grid-template-rows: 100px 100px;
                gap: 10px;
                background: white;
                border-radius: 1.2rem;
                padding: 20px;
                border: 1px solid #ccc;
                margin-top: 20px;
            }
            .grid-item {
                background-color: #4caf50;
                color: white;
                padding: 20px;
                text-align: center;
                border-radius: 0.5rem;
            }
             .item1 { background-color: #2196f3; }
             .item2 { background-color: #f44336; }
             .item3 { background-color: #ff9800; }
             .item4 { background-color: #9c27b0; }
             .item5 { background-color: #00bcd4; }
             .item6 { background-color: #8bc34a; }
            </style>
    </head>
    <body>

        <div class="card">
            <h1>Card Title</h1>
            <p>This is a simple card 
                layout using 
                CSS Grid.</p>

        <!-- this is a simple card layout using CSS Grid -->
        <div class="grid-demo">
            <div class="grid-item item1">Item 1</div>
            <div class="grid-item item2">Item 2</div>
            <div class="grid-item item3">Item 3</div>
            <div class="grid-item item4">Item 4</div>
            <div class="grid-item item5">Item 5</div>
            <div class="grid-item item6">Item 6</div>
        </div>
    </body>
</html>
